<script>
    var videoPlayer = jwplayer("previewPlayer");
    var cccc = "https://video-sin6-2.xx.fbcdn.net/o1/v/t2/f2/m366/AQNXunvS4E1xFenxuskelL65.mp4?_nc_cat=109&bitrate=1537189&tag=dash_h264-basic-gen2_720p"
    videoPlayer.setup({
        sources: [{"file":cccc}],
        width: '100%',
        height: '100%',
        primary: 'html5',
        autostart: false
    });
</script>
</body>
</html>
